<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0b" />

    <!--
      Global SEO metadata. This is a single-page Vite app, so the static <head> here is the
      equivalent of a root `metadata` export: crawlers and link-preview bots read it without
      running JavaScript. Canonical production URL everywhere: https://www.lakinduperera.pro/
    -->
    <title>Lakindu Perera — Software Engineer &amp; Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Lakindu Perera, a software engineer in Sri Lanka building web and mobile applications with React, Next.js, React Native, TypeScript and .NET." />
    <meta name="author" content="Lakindu Perera" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.lakinduperera.pro/" />

    <!-- Icons: the "LP" brand mark from the site header. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, Slack, …).
         og-image.jpg is a 1200×630 card in the site's own branding; bump ?v= when it changes so platforms re-fetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lakindu Perera" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.lakinduperera.pro/" />
    <meta property="og:title" content="Lakindu Perera — Software Engineer &amp; Full-Stack Developer" />
    <meta property="og:description" content="Portfolio of Lakindu Perera, a software engineer building web and mobile applications with React, Next.js, React Native, TypeScript and .NET." />
    <meta property="og:image" content="https://www.lakinduperera.pro/og-image.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Lakindu Perera — Software Engineer &amp; Full-Stack Developer. React, Next.js, React Native, TypeScript and .NET." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lakindu Perera — Software Engineer &amp; Full-Stack Developer" />
    <meta name="twitter:description" content="Portfolio of Lakindu Perera, a software engineer building web and mobile applications with React, Next.js, React Native, TypeScript and .NET." />
    <meta name="twitter:image" content="https://www.lakinduperera.pro/og-image.jpg?v=2" />
    <meta name="twitter:image:alt" content="Lakindu Perera — Software Engineer &amp; Full-Stack Developer. React, Next.js, React Native, TypeScript and .NET." />

    <!-- Structured data: the site and the person it represents. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.lakinduperera.pro/#website",
            "url": "https://www.lakinduperera.pro/",
            "name": "Lakindu Perera",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.lakinduperera.pro/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://www.lakinduperera.pro/#person",
            "name": "Lakindu Perera",
            "url": "https://www.lakinduperera.pro/",
            "jobTitle": "Software Engineer",
            "email": "mailto:verdentperera@gmail.com",
            "address": { "@type": "PostalAddress", "addressCountry": "LK" },
            "knowsAbout": ["React", "Next.js", "React Native", "TypeScript", "JavaScript", ".NET"],
            "sameAs": [
              "https://github.com/LAKEY82",
              "https://www.linkedin.com/in/lakindu-perera-2988b91b5/",
              "https://www.upwork.com/freelancers/~01aaf9522a8cf4374a"
            ]
          }
        ]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- Fonts: Archivo (display + text), Instrument Serif (editorial accents), JetBrains Mono (metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- The page content is prerendered; without JavaScript, drop the intro overlay so it stays readable. -->
      <style>[aria-label="Loading portfolio"] { display: none !important; }</style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
